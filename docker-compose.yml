# Local development only — run: docker compose up --build
# Frontend: http://localhost:5173  |  Backend API: http://localhost:8000/api

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tradex-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    environment:
      DEBUG: "True"
      SECRET_KEY: docker-dev-secret-change-me
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,0.0.0.0
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DATABASE_PATH: /app/backend/tradex/db.sqlite3
      SITE_URL: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
    working_dir: /app/backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: tradex-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - tradex_frontend_node_modules:/app/frontend/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  tradex_frontend_node_modules:
