# Render Blueprint — 24TradeX (Django + React, SQLite on persistent disk)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tradex
    runtime: python
    plan: starter
    buildCommand: bash scripts/build-render.sh
    startCommand: bash scripts/start-render.sh
    healthCheckPath: /api/healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: NODE_VERSION
        value: "22.12.0"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "s24tx.com,www.s24tx.com,tradex.onrender.com,localhost,127.0.0.1"
      - key: SITE_URL
        value: "https://s24tx.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://s24tx.com,https://www.s24tx.com,https://tradex.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://s24tx.com,https://www.s24tx.com,https://tradex.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: DB_ENGINE
        value: django.db.backends.sqlite3
      - key: DATABASE_PATH
        value: /var/data/db.sqlite3
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
